# LGRC-Net model graph with standard C3k2 blocks at backbone layers 6 and 8.
# Loss settings are controlled by train.py --nwd / --iou-ratio, not YAML comments.
nc: 6
scale: n
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2_MSEdge, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2_MSSelect, [512, False, 0.375]] # 4: c1=64,c2=128,n=1,c3k=False,e=.375
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.50, 1]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, False, 0.50, 1]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 1, LiteP5Encoder, [1024, 0.375, 4, 2.0, 0.1]] # 10: Transformer embedding96

head:
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2_P3LocalRefine, [256, False]] # 16: original local refinement
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]
  - [[16, 19, 22], 1, TriScaleResidualFusion, [64, 0.1]] # 23: three in / three out
  - [23, 1, ScaleFeatureSelect, [0]]
  - [23, 1, ScaleFeatureSelect, [1]]
  - [23, 1, ScaleFeatureSelect, [2]]
  - [[24, 25, 26, 16], 1, Detect_LSDECD_P3NativeReg, [nc, 256]] # 27: original head/native P3
